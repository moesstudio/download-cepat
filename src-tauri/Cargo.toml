[package]
name = "download-cepat-app"
version = "1.0.0"
description = "Download Cepat — High-speed multi-connection download manager"
authors = ["Ujang Mustamar"]
license = "MIT"
repository = "https://github.com/moesstudio/download-cepat"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["devtools", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
core-engine = { path = "../core-engine" }
open = "5.4.5"
dirs = "7.0.0"
tokio = { version = "1.54.1", features = ["full"] }

