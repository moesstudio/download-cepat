name: Build & Release Multi-Platform Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            name: 'macOS'
          - platform: 'windows-latest'
            name: 'Windows'
          - platform: 'ubuntu-22.04'
            name: 'Linux'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri Desktop App & Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || 'v1.0.0' }}
          releaseName: 'Download Cepat v__VERSION__'
          releaseBody: |
            ### Download Cepat v__VERSION__
            Official release built and maintained by **Ujang Mustamar**.
            Multi-connection high-speed download manager desktop release for macOS, Windows, and Linux.

            #### 📦 Paket Installer Tersedia:
            - **macOS**: `Download Cepat_1.0.0_universal.dmg` (Apple Silicon & Intel)
            - **Windows**: `Download Cepat_1.0.0_x64-setup.exe` (NSIS Installer) & `.msi`
            - **Linux**: `download-cepat_1.0.0_amd64.AppImage` & `.deb`
          releaseDraft: false
          prerelease: false
