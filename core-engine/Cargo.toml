[package]
name = "core-engine"
version = "0.1.0"
edition = "2021"
authors = ["Ujang Mustamar"]
license = "MIT"
repository = "https://github.com/moesstudio/download-cepat"
description = "High-performance multi-connection segmented download engine"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"

[[bin]]
name = "download-cepat-cli"
path = "src/bin/cli.rs"
