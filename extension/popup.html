<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon {
      width: 26px;
      height: 26px;
      background: #2563eb;
      color: #ffffff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
    }
    .title { font-size: 13px; font-weight: 700; }
    .status { font-size: 10px; color: #94a3b8; }
    .status.online { color: #4ade80; }
    .status.offline { color: #f87171; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 11px;
      margin-bottom: 8px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    button {
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
    }
    .btn-secondary:hover { background: #475569; }
    .lang-select {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 5px;
      padding: 2px 5px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .footer-credit {
      text-align: center;
      font-size: 9px;
      color: #64748b;
      margin-top: 2px;
    }
    .streams {
      max-height: 150px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }
    .stream-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 5px 7px;
      font-size: 10px;
    }
    .stream-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #e2e8f0;
    }
    #feedback {
      font-size: 10px;
      color: #38bdf8;
      margin-top: 4px;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="icon">⚡</div>
      <div>
        <div class="title">Download Cepat</div>
        <div id="bridgeStatus" class="status">Memeriksa engine...</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <select id="langSelect" class="lang-select" aria-label="Language">
        <option value="id">ID</option>
        <option value="en">EN</option>
        <option value="ms">MS</option>
        <option value="ja">JA</option>
      </select>
      <label style="font-size:11px; display:flex; align-items:center; gap:4px; cursor:pointer;">
        <input type="checkbox" id="toggleIntercept" checked />
        <span id="toggleActiveLabel">Aktif</span>
      </label>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span id="siteHost" style="font-weight:600; color:#cbd5e1;">Situs aktif</span>
      <button id="toggleSiteBtn" class="btn-secondary">Kecualikan</button>
    </div>
  </div>

  <div class="card">
    <button id="downloadAllBtn" class="btn-primary">Download Semua Link Halaman ⚡</button>
    <div id="feedback"></div>
  </div>

  <div class="card">
    <div style="font-weight:600; color:#cbd5e1;"><span id="detectedMediaLabel">Media Terdeteksi di Tab</span> (<span id="streamCount">0</span>)</div>
    <div id="streamList" class="streams">
      <span id="emptyStreamMsg" style="color:#64748b;">Belum ada stream media terdeteksi.</span>
    </div>
  </div>

  <div class="footer-credit">Ujang Mustamar &bull; v1.0.0</div>

  <script src="popup.js"></script>
</body>
</html>
